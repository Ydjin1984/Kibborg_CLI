# Serve / attach / auth в Compose: сервер как сервис с healthcheck и токеном.
#
# Токен и ключ провайдера лежат в файле `.env` рядом с этим compose-файлом
# (в git он не попадает: `.env` в .gitignore). Пример содержимого:
#   KIBBORG_SERVER_TOKEN=<openssl rand -hex 32>
#   DEEPSEEK_API_KEY=<ключ провайдера>
#
# Запуск:  docker compose -f Kibborg_CLI/deploy/docker-compose.yml up --build
# Клиент:  kibborg attach http://127.0.0.1:7317 --token "$KIBBORG_SERVER_TOKEN"

services:
  kibborg:
    build:
      context: ../..
      dockerfile: Kibborg_CLI/deploy/Dockerfile
    image: kibborg-server:local
    restart: unless-stopped
    environment:
      KIBBORG_SERVER_TOKEN: ${KIBBORG_SERVER_TOKEN:?set KIBBORG_SERVER_TOKEN in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      KIBBORG_SERVE_HOST: 0.0.0.0
      KIBBORG_SERVE_PORT: "7317"
    # Порт публикуется только на loopback машины: наружу его выставляет
    # оператор (SSH-туннель или обратный прокси), и тогда токен остаётся
    # единственным, что защищает API.
    ports:
      - "127.0.0.1:7317:7317"
    volumes:
      - kibborg-home:/var/lib/kibborg/.dsh
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/kibborg-healthcheck", "http://127.0.0.1:7317"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kibborg-home:
